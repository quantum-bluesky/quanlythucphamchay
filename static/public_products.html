<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Danh sách các thực phẩm chay</title>
  <link rel="stylesheet" href="./static/styles.css">
  <link rel="stylesheet" href="./static/public_products.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="public-container">
    <header class="public-header">
      <h1>Danh sách các thực phẩm chay</h1>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Tìm kiếm sản phẩm..." autocomplete="off">
      </div>
      <div class="filter-bar">
        <label class="toggle-inline" style="cursor: pointer; user-select: none;">
          <input type="checkbox" id="inStockCheckbox" checked>
          <span>Chỉ hiện những mặt hàng đang có sẵn</span>
        </label>
        <label class="toggle-inline" style="cursor: pointer; user-select: none;">
          <input type="checkbox" id="incomingCheckbox" checked>
          <span>Bao gồm cả hàng đã đặt, sắp về</span>
        </label>
      </div>
      <div class="view-mode-bar" style="display: flex; gap: 1rem; margin-top: 12px; padding: 0 1rem;">
        <span style="font-weight: 500; font-size: 0.9em; color: var(--text-muted);">Giao diện:</span>
        <label class="toggle-inline" style="cursor: pointer; user-select: none;">
          <input type="radio" name="viewMode" value="thumbnail" checked>
          <span>Ảnh (Thumbnail)</span>
        </label>
        <label class="toggle-inline" style="cursor: pointer; user-select: none;">
          <input type="radio" name="viewMode" value="list">
          <span>Danh sách rút gọn</span>
        </label>
      </div>
    </header>
    
    <main class="public-main" style="padding-bottom: 80px;">
      <div id="productGrid" class="product-grid">
        <!-- Products will be rendered here -->
      </div>
      <div id="loading" class="loading-spinner">Đang tải...</div>
    </main>
    
    <div id="cartBar" class="public-cart-bar hidden">
      <div class="cart-bar-info">
        <span id="cartCountBadge" class="cart-badge">0</span>
        <span class="cart-label">sản phẩm đã chọn</span>
      </div>
      <button id="copySelectedBtn" class="secondary-button compact-button">Copy danh sách</button>
    </div>
  </div>

  <!-- Product Modal -->
  <div id="productModal" class="modal-overlay hidden">
    <div class="modal-content">
      <button id="closeModal" class="modal-close">&times;</button>
      <div class="modal-body">
        <div class="modal-images-container" style="position: relative;">
          <div id="modalImages" class="modal-images"></div>
          <button id="modalPrevImg" class="carousel-nav prev-img" aria-label="Ảnh trước">&lt;</button>
          <button id="modalNextImg" class="carousel-nav next-img" aria-label="Ảnh sau">&gt;</button>
          <div id="modalImgDots" class="carousel-dots"></div>
        </div>
        <div class="modal-info">
          <h2 id="modalName"></h2>
          <p id="modalCategory" class="text-muted"></p>
          <div class="modal-actions">
             <button id="copyLinkBtn" class="primary-button wide-button">Chia sẻ Link</button>
          </div>
          <div id="modalDetails" class="modal-details rich-text"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="./static/public_products.js"></script>
</body>
</html>
