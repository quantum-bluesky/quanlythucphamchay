name: Deploy Product to Production

on:
  workflow_dispatch:
    inputs:
      supplier_query:
        description: "Tên hoặc từ khóa tìm kiếm NCC (Fuzzy search)"
        required: false
        default: "Chị Ngọc anh Hải"
      supplier_id:
        description: "Mã ID NCC chính xác trên Production (nếu muốn chỉ định rõ)"
        required: false
        default: ""
      manifest:
        description: "Đường dẫn file manifest cần triển khai"
        required: false
        default: "data/staged_releases/cha_bao_rong_bien.json"

jobs:
  deploy_to_production:
    name: Deploy Staged Release to Production
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Deploy Staged Release
        env:
          REMOTE_APP_URL: ${{ secrets.PROD_APP_URL || vars.PROD_APP_URL }}
          REMOTE_ADMIN_USER: ${{ secrets.PROD_ADMIN_USER || vars.PROD_ADMIN_USER }}
          REMOTE_ADMIN_PASSWORD: ${{ secrets.PROD_ADMIN_PASSWORD }}
        run: |
          python scripts/remote_ops.py deploy-release \
            --manifest "${{ github.event.inputs.manifest }}" \
            --supplier-id "${{ github.event.inputs.supplier_id }}" \
            --supplier-query "${{ github.event.inputs.supplier_query }}"
