name: Deploy Product to Production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Thao tác cần thực thi: history | deploy-release | status"
        required: false
        default: "history"
      product_targets:
        description: "Danh sách sản phẩm xem lịch sử (ví dụ: '117 118')"
        required: false
        default: "117 118"
      supplier_query:
        description: "Tên hoặc từ khóa tìm kiếm NCC (Fuzzy search)"
        required: false
        default: "Tình Nguyệt"
      supplier_id:
        description: "Mã ID NCC chính xác trên Production (nếu muốn chỉ định rõ)"
        required: false
        default: ""
      allow_create_supplier:
        description: "Tự động tạo NCC nếu chưa có trên hệ thống"
        required: false
        default: "true"
      with_initial_inventory:
        description: "Tạo phiếu nhập kho ban đầu (chỉ chọn true khi đã xác nhận rõ số lượng thực tế)"
        required: false
        default: "false"
      manifest:
        description: "Đường dẫn file manifest cần triển khai"
        required: false
        default: "data/staged_releases/cha_bao_rong_bien.json"

jobs:
  deploy_to_production:
    name: Run Production Operation
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Operation on Production
        env:
          REMOTE_APP_URL: ${{ secrets.PROD_APP_URL || vars.PROD_APP_URL }}
          REMOTE_ADMIN_USER: ${{ secrets.PROD_ADMIN_USER || vars.PROD_ADMIN_USER }}
          REMOTE_ADMIN_PASSWORD: ${{ secrets.PROD_ADMIN_PASSWORD }}
        run: |
          OP="${{ github.event.inputs.operation }}"
          if [ "$OP" = "history" ]; then
            python scripts/remote_ops.py history ${{ github.event.inputs.product_targets }}
          elif [ "$OP" = "status" ]; then
            python scripts/remote_ops.py status
          else
            ALLOW_CREATE_FLAG=""
            if [ "${{ github.event.inputs.allow_create_supplier }}" = "true" ]; then
              ALLOW_CREATE_FLAG="--allow-create-supplier"
            fi
            WITH_INV_FLAG=""
            if [ "${{ github.event.inputs.with_initial_inventory }}" = "true" ]; then
              WITH_INV_FLAG="--with-initial-inventory"
            fi
            python scripts/remote_ops.py deploy-release \
              --manifest "${{ github.event.inputs.manifest }}" \
              --supplier-id "${{ github.event.inputs.supplier_id }}" \
              --supplier-query "${{ github.event.inputs.supplier_query }}" \
              $ALLOW_CREATE_FLAG \
              $WITH_INV_FLAG
          fi

